<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#faf8ed"><title>鳩びより｜鳩たちの観察ひろば</title><link rel="stylesheet" href="./style.css"></head><body>
<header><div class="head-inner"><a class="brand" href="#field" aria-label="鳩びより ホーム"><canvas id="logo" width="34" height="30"></canvas><span class="brand-type"><b>鳩びより</b><small>HATO BIYORI</small></span></a><div class="head-rule"></div><span class="brand-sub">鳩の観察箱庭</span><button id="sound" class="sound" aria-pressed="false"><i data-icon="mute"></i><span>音声 OFF</span></button><button id="help" class="help" aria-label="遊びかた">?</button></div></header>
<main><section id="field"><div class="heading"><div class="heading-name"><span class="bigicon" data-icon="binocular"></span><h1>観察ひろば</h1><span class="eyebrow">OBSERVATION FIELD</span></div><span class="online"><em></em><span id="live">観察中</span></span></div>
<div class="layout"><div class="stage" id="stage"><div class="land"><canvas id="world" width="480" height="270" tabindex="0" aria-label="鳩の観察風景。地面をクリックすると餌をまけます"></canvas><span class="loc"><i data-icon="pin"></i><b id="locName">まちの公園</b></span><span class="count"><i data-icon="bird"></i><b id="count">8</b>羽</span></div><div class="stage-foot"><i data-icon="cursor"></i><span>地面をクリックして餌をまこう</span><div class="stage-controls"><button id="pause" aria-label="一時停止" title="一時停止"><i data-icon="pause"></i></button><b></b><button id="expand" aria-label="全画面" title="全画面"><i data-icon="expand"></i></button></div></div></div>
<aside><div class="panel locations"><h2><i data-icon="map"></i>観察スポット</h2><div id="choices"></div></div><div class="panel action"><h2><i data-icon="hand"></i>アクション</h2><button id="feed"><i data-icon="seed"></i>餌をまく</button><button id="scare"><i data-icon="wings"></i>おどろかす</button></div></aside></div></section>
<section class="catalog"><div class="gallery-title"><span data-icon="book"></span><h2>鳩の図鑑</h2><span class="eyebrow">PIGEON ALBUM</span><button id="all">すべて見る<i data-icon="grid"></i></button></div><div id="previewBirds"></div></section>
<footer><span class="grass"></span><span>HATO BIYORI</span><span class="grass"></span></footer></main>
<dialog id="dialog"><div class="dialog-top"><h2 id="dialogTitle"></h2><button id="close" aria-label="閉じる">×</button></div><div id="dialogContent"></div></dialog>
<script type="module" src="./ui.js"></script></body></html>
